name: Revisão diária do agente SDR

on:
  schedule:
    # 8h no horário de Brasília (11h UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    name: Revisão automatizada

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Data do relatório
        run: echo "DATA_RELATORIO=$(TZ=America/Sao_Paulo date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Revisar operação das últimas 24h
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Siga as instruções de revisao/agente-revisor.md.
            Revise as últimas 24 horas de operação do agente SDR e salve o relatório em
            revisao/relatorios/${{ env.DATA_RELATORIO }}.md.
            As variáveis N8N_API_URL, N8N_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY e CRM_LEADS_URL
            estão no ambiente. Use curl para consultar as APIs.
          claude_args: |
            --allowedTools "Bash(curl:*),Bash(jq:*),Read,Write"
        env:
          N8N_API_URL: ${{ secrets.N8N_API_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRM_LEADS_URL: ${{ secrets.CRM_LEADS_URL }}

      - name: Versionar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revisao/relatorios/
          git diff --staged --quiet || git commit -m "chore: relatório de revisão ${DATA_RELATORIO}"
          git push
